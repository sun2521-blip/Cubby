[package]
name = "cubby"
version = "0.1.0"
description = "An allowance wallet for AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cubby"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.32.3"
anchor-spl = "0.32.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
